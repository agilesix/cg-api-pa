name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run wrangler:types

      - name: Create DB + migrate + deploy
        id: preview
        run: ./scripts/preview-create.sh "pr-${{ github.event.pull_request.number }}"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            **Preview deployed** for PR #${{ github.event.pull_request.number }}
            🔗 **${{ steps.preview.outputs.url }}**
            Worker: `pa-commongrants-api-pr-${{ github.event.pull_request.number }}`
            D1: `${{ steps.preview.outputs.db_name }}`
            Commit: `${{ github.sha }}`

  cleanup:
    name: Clean up preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Delete ephemeral D1
        run: ./scripts/preview-cleanup.sh "pr-${{ github.event.pull_request.number }}"

      - name: Update comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deploy
          message: |
            **Preview removed** for PR #${{ github.event.pull_request.number }}
            The ephemeral D1 database and preview Worker have been cleaned up.
